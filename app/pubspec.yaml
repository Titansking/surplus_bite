name: surplus_bite
description: "SurplusBite: Hyperlocal Food Waste & Surplus Redistribution Network"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_messaging: ^16.7.0
  firebase_analytics: ^12.6.0
  google_sign_in: ^7.2.0

  # Image Upload (Cloudinary - free tier)
  http: ^1.6.0

  # State Management
  flutter_riverpod: ^3.4.3

  # UI
  google_maps_flutter: ^2.18.1
  cached_network_image: ^4.0.0
  image_picker: ^1.2.3
  flutter_image_compress: ^2.5.1
  flutter_rating_bar: ^4.0.1
  shimmer: ^4.0.0
  photo_view: ^0.15.0

  # Location
  geolocator: ^14.0.3
  geocoding: ^5.0.0

  # Utilities
  intl: ^0.20.3
  timeago: ^3.7.1
  uuid: ^4.6.0
  equatable: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Firebase platform-interface mocks for tests
  firebase_auth_platform_interface: ^9.1.0
  cloud_firestore_platform_interface: ^8.0.7
  firebase_core_platform_interface: ^8.1.1
  firebase_messaging_platform_interface: ^4.10.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/